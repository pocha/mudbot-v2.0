<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watobot — Chat</title>
    <meta name="description" content="Ask your Watobot assistant to do something." />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist&display=swap" rel="stylesheet" />
    <script src="./assets/theme.js"></script>
    <link rel="stylesheet" href="./assets/theme.css" />
  </head>
  <body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center px-4 selection:bg-primary-container selection:text-on-primary-container">
    <main class="w-full max-w-lg">
      <div class="flex items-center justify-center gap-3 mb-8">
        <img alt="Watobot logo" class="w-10 h-10 rounded-sm" src="./assets/logo.png" />
        <span class="font-headline-md text-headline-md font-bold text-primary">Watobot</span>
      </div>

      <div class="bg-surface-container-lowest w-full rounded-xl p-6 whatsapp-shadow border border-outline-variant flex flex-col" style="height: 70vh">
        <div id="log" class="flex-1 overflow-y-auto flex flex-col gap-3 mb-4 pr-1"></div>

        <form id="send-form" class="hidden flex gap-2">
          <input
            id="message"
            type="text"
            autocomplete="off"
            class="flex-1 bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-lg p-3 transition-all outline-none"
            placeholder="Ask your assistant something..."
          />
          <button
            id="send"
            type="submit"
            class="bg-primary-container text-on-primary-container font-bold px-5 rounded-xl hover:opacity-90 active:scale-95 transition-all"
          >
            Send
          </button>
        </form>
      </div>

      <p id="status" class="text-on-surface-variant font-body-md text-sm mt-4 min-h-[20px] text-center">Checking sign-in...</p>
    </main>

    <script type="module" src="./chat.js"></script>
  </body>
</html>
