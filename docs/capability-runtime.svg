<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" role="img" aria-label="Extension, web chat, the Firebase ingest trigger, the VM orchestrator, and per-user containers all read or write a shared Realtime Database bus at the bottom of the diagram, on three paths: ingestQueue for raw WhatsApp messages, commands for the web chat's live query-and-reply channel, and dispatchQueue for capability jobs. The ingest trigger and each container also talk directly to Firestore above the bus for durable, queryable data: memories with vector search, conversation history, and the capability registry. The orchestrator mints a per-user scoped token from a control endpoint before starting that user's container, and every VM-to-Firebase connection is outbound only.">
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace; }
    .ink { fill: #172230; }
    .muted { fill: #526270; }
    .faint { fill: #8494a1; }
    .box-fill { fill: #e4e9ed; stroke: #c7d0d7; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8494a1"></path>
    </marker>
    <marker id="arrowCloud" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"></path>
    </marker>
    <marker id="arrowVm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5590f"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="780" fill="#f7f9fb"></rect>

  <!-- ================= CLIENTS ================= -->
  <rect x="40" y="40" width="230" height="90" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="155" y="76" text-anchor="middle" class="ink" font-size="14" font-weight="600">Extension</text>
  <text x="155" y="98" text-anchor="middle" class="muted mono" font-size="11">WhatsApp Web session</text>

  <rect x="40" y="440" width="230" height="90" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="155" y="476" text-anchor="middle" class="ink" font-size="14" font-weight="600">Web chat page</text>
  <text x="155" y="498" text-anchor="middle" class="muted mono" font-size="11">phone auth → chat UI</text>

  <!-- ================= FIREBASE: functions + firestore ================= -->
  <text x="465" y="18" text-anchor="middle" class="muted mono" font-size="10.5" letter-spacing="0.03em">FIREBASE · TRUSTED FIRST-PARTY CODE</text>

  <rect x="330" y="40" width="270" height="100" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="465" y="74" text-anchor="middle" class="ink" font-size="14" font-weight="600">Ingest / command trigger</text>
  <text x="465" y="95" text-anchor="middle" class="muted mono" font-size="10.5">RTDB onValueCreated</text>
  <text x="465" y="115" text-anchor="middle" class="muted" font-size="10.5">synthesize · match / build capability</text>

  <rect x="330" y="190" width="270" height="190" rx="8" fill="#dcf0f1" stroke="#0e7c86" stroke-width="1.5"></rect>
  <text x="465" y="222" text-anchor="middle" class="ink" font-size="15" font-weight="700">Firestore</text>
  <text x="465" y="240" text-anchor="middle" class="muted" font-size="10.5">durable · uid-scoped rules</text>
  <text x="352" y="268" class="muted mono" font-size="11">memories</text>
  <text x="366" y="285" class="faint" font-size="9.5">↳ vector search</text>
  <text x="352" y="309" class="muted mono" font-size="11">conversations</text>
  <text x="352" y="331" class="muted mono" font-size="11">capabilities</text>
  <text x="465" y="360" text-anchor="middle" class="faint" font-size="9">no RTDB equivalent for vector search</text>

  <rect x="330" y="440" width="270" height="100" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="465" y="474" text-anchor="middle" class="ink" font-size="14" font-weight="600">Control endpoint</text>
  <text x="465" y="496" text-anchor="middle" class="muted mono" font-size="11">mintContainerToken()</text>
  <text x="465" y="517" text-anchor="middle" class="faint" font-size="10">Admin SDK · no VM key issued</text>

  <!-- ================= VM ================= -->
  <rect x="690" y="30" width="470" height="400" rx="10" fill="none" stroke="#b5590f" stroke-width="1.5" stroke-dasharray="6 5"></rect>
  <text x="706" y="54" class="ink" font-size="13" font-weight="600" fill="#b5590f">Linux VM · 4 GB · self-hosted</text>
  <text x="706" y="72" class="faint" font-size="10.5">outbound-only — no inbound ports</text>

  <rect x="710" y="88" width="430" height="80" rx="8" fill="#f7e6d5" stroke="#b5590f" stroke-width="1.5"></rect>
  <text x="925" y="120" text-anchor="middle" class="ink" font-size="14" font-weight="600">Orchestrator daemon</text>
  <text x="925" y="141" text-anchor="middle" class="muted" font-size="10.5">live dispatchQueue listener</text>

  <rect x="710" y="196" width="430" height="60" rx="7" fill="#f7e6d5" stroke="#b5590f" stroke-width="1.6"></rect>
  <text x="925" y="222" text-anchor="middle" class="ink" font-size="13" font-weight="600">container · uid A</text>
  <text x="925" y="240" text-anchor="middle" class="muted" font-size="10.5">running</text>

  <rect x="710" y="272" width="430" height="46" rx="7" fill="#e4e9ed" stroke="#8494a1" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75"></rect>
  <text x="925" y="300" text-anchor="middle" class="faint" font-size="11.5">container · uid B — idle</text>

  <rect x="710" y="334" width="430" height="40" rx="7" fill="none" stroke="#8494a1" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"></rect>
  <text x="925" y="359" text-anchor="middle" class="faint" font-size="11">container · uid C — stopped</text>

  <!-- ================= REALTIME DATABASE BUS ================= -->
  <rect x="40" y="560" width="1120" height="180" rx="10" fill="#dcf0f1" stroke="#0e7c86" stroke-width="1.5"></rect>
  <text x="600" y="598" text-anchor="middle" class="ink" font-size="16" font-weight="700">Realtime Database</text>
  <text x="600" y="618" text-anchor="middle" class="muted" font-size="11">ephemeral · rules scoped per uid / per path — everything above reads or writes here</text>

  <text x="210" y="666" text-anchor="middle" class="muted mono" font-size="11.5" font-weight="600">ingestQueue/{uid}</text>
  <text x="210" y="684" text-anchor="middle" class="faint" font-size="10">raw WhatsApp messages</text>

  <text x="600" y="666" text-anchor="middle" class="muted mono" font-size="11.5" font-weight="600">commands/{uid}</text>
  <text x="600" y="684" text-anchor="middle" class="faint" font-size="10">web-chat query ↔ reply</text>

  <text x="990" y="666" text-anchor="middle" class="muted mono" font-size="11.5" font-weight="600">dispatchQueue</text>
  <text x="990" y="684" text-anchor="middle" class="faint" font-size="10">capability jobs · job metadata only</text>

  <!-- ================= Lateral arrows (not via the bus) ================= -->
  <!-- Ingest trigger -> Firestore -->
  <line x1="465" y1="140" x2="465" y2="188" stroke="#0e7c86" stroke-width="1.5" marker-end="url(#arrowCloud)"></line>
  <text x="530" y="167" text-anchor="middle" class="muted" font-size="10">writes memory + conversation</text>

  <!-- Orchestrator -> Control endpoint (mint token) -->
  <path d="M710,150 C 680,150 650,420 602,436" fill="none" stroke="#b5590f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowVm)"></path>
  <text x="660" y="290" text-anchor="middle" class="muted mono" font-size="10">mint token(uid)</text>

  <!-- Orchestrator -> container A (start/stop) -->
  <line x1="925" y1="168" x2="925" y2="194" stroke="#b5590f" stroke-width="1.6" marker-end="url(#arrowVm)"></line>
  <text x="1030" y="185" text-anchor="middle" class="muted mono" font-size="9.5">start / stop · idle timeout</text>

  <!-- container A -> Firestore (scoped read/write) -->
  <path d="M708,215 C 660,215 618,260 602,262" fill="none" stroke="#b5590f" stroke-width="1.6" marker-end="url(#arrowVm)"></path>
  <text x="655" y="203" text-anchor="middle" class="muted mono" font-size="9.5">scoped session:</text>
  <text x="655" y="215" text-anchor="middle" class="faint" font-size="9">read/write memories</text>

  <!-- ================= Bus connections: CLIENTS ================= -->
  <!-- Extension -> bus (ingestQueue) -->
  <path d="M270,85 L300,85 L300,558" fill="none" stroke="#8494a1" stroke-width="1.4" marker-end="url(#arrow)"></path>
  <text x="312" y="350" text-anchor="middle" class="muted mono" font-size="10.5" transform="rotate(-90 312 350)">push → ingestQueue/{uid}</text>

  <!-- Web chat page -> bus (commands, write) -->
  <path d="M270,465 L292,465 L292,558" fill="none" stroke="#8494a1" stroke-width="1.4" marker-end="url(#arrow)"></path>
  <text x="304" y="500" text-anchor="middle" class="muted mono" font-size="10" transform="rotate(-90 304 500)">push → commands</text>

  <!-- bus -> Web chat page (commands, reply) -->
  <path d="M318,558 L318,490 L270,490" fill="none" stroke="#8494a1" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"></path>
  <text x="330" y="500" text-anchor="middle" class="faint mono" font-size="10" transform="rotate(-90 330 500)">onValue → reply</text>

  <text x="155" y="546" text-anchor="middle" class="faint" font-size="9">(extension has no reply channel yet)</text>

  <!-- ================= Bus connections: FIREBASE ================= -->
  <!-- bus -> Ingest trigger (onValueCreated) -->
  <line x1="605" y1="558" x2="605" y2="142" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#arrowCloud)"></line>
  <!-- Ingest trigger -> bus (writes job to dispatchQueue) -->
  <line x1="619" y1="142" x2="619" y2="558" stroke="#0e7c86" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowCloud)"></line>
  <text x="611" y="330" text-anchor="middle" class="muted mono" font-size="10" transform="rotate(-90 611 330)">onValueCreated · writes job → dispatchQueue</text>

  <!-- ================= Bus connections: VM ================= -->
  <!-- bus -> Orchestrator (onValue: dispatchQueue, live) -->
  <path d="M650,558 L650,180 L712,142" fill="none" stroke="#b5590f" stroke-width="1.6" marker-end="url(#arrowVm)"></path>
  <text x="638" y="460" text-anchor="middle" class="muted mono" font-size="10" transform="rotate(-90 638 460)">onValue: dispatchQueue — live, no poll</text>

  <!-- container A -> bus (writes reply to commands) -->
  <path d="M712,226 L675,226 L675,558" fill="none" stroke="#b5590f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowVm)"></path>
  <text x="663" y="460" text-anchor="middle" class="muted mono" font-size="10" transform="rotate(-90 663 460)">writes reply → commands/{uid}</text>
</svg>
