<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" role="img" aria-label="Extension and web chat push into Realtime Database queues; a Cloud Function triggers on new values, writes durable memory and conversation records to Firestore, and pushes a job into the Realtime Database dispatch queue; the VM's orchestrator holds a live listener on that queue (not a poll), mints a per-user scoped token, and starts or stops that user's Docker container; the container talks to Firestore with its scoped session and writes its reply back into the Realtime Database command channel.">
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace; }
    .ink { fill: #172230; }
    .muted { fill: #526270; }
    .faint { fill: #8494a1; }
    .box-fill { fill: #e4e9ed; stroke: #c7d0d7; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8494a1"></path>
    </marker>
    <marker id="arrowCloud" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"></path>
    </marker>
    <marker id="arrowVm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5590f"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="700" fill="#f7f9fb"></rect>

  <!-- ===== Client column ===== -->
  <rect x="40" y="80" width="220" height="70" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="150" y="108" text-anchor="middle" class="ink" font-size="13.5" font-weight="600">Extension</text>
  <text x="150" y="126" text-anchor="middle" class="muted mono" font-size="11">WhatsApp Web session</text>

  <rect x="40" y="540" width="220" height="70" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="150" y="568" text-anchor="middle" class="ink" font-size="13.5" font-weight="600">Web chat page</text>
  <text x="150" y="586" text-anchor="middle" class="muted mono" font-size="11">phone auth → chat UI</text>

  <!-- ===== Realtime Database ===== -->
  <rect x="300" y="60" width="220" height="580" rx="10" fill="#dcf0f1" stroke="#0e7c86" stroke-width="1.5"></rect>
  <text x="410" y="90" text-anchor="middle" class="ink" font-size="14.5" font-weight="700">Realtime Database</text>
  <text x="410" y="107" text-anchor="middle" class="muted" font-size="10.5">ephemeral · rules: uid / path scoped</text>

  <text x="320" y="245" class="muted mono" font-size="11" font-weight="600">ingestQueue/{uid}</text>
  <text x="320" y="262" class="faint" font-size="10">raw WhatsApp messages</text>

  <text x="320" y="360" class="muted mono" font-size="11" font-weight="600">commands/{uid}</text>
  <text x="320" y="377" class="faint" font-size="10">web-chat query ↔ reply</text>

  <text x="320" y="475" class="muted mono" font-size="11" font-weight="600">dispatchQueue</text>
  <text x="320" y="492" class="faint" font-size="10">capability jobs, top-level</text>

  <!-- ===== Cloud Functions column ===== -->
  <text x="700" y="94" text-anchor="middle" class="muted mono" font-size="10.5" letter-spacing="0.03em">FIREBASE · TRUSTED FIRST-PARTY CODE</text>

  <rect x="590" y="120" width="220" height="90" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="700" y="148" text-anchor="middle" class="ink" font-size="13" font-weight="600">Ingest trigger</text>
  <text x="700" y="165" text-anchor="middle" class="muted mono" font-size="10.5">RTDB onValueCreated</text>
  <text x="700" y="182" text-anchor="middle" class="muted" font-size="11">synthesize · match / build capability</text>

  <rect x="590" y="280" width="220" height="150" rx="8" fill="#dcf0f1" stroke="#0e7c86" stroke-width="1.5"></rect>
  <text x="700" y="308" text-anchor="middle" class="ink" font-size="14" font-weight="700">Firestore</text>
  <text x="700" y="325" text-anchor="middle" class="muted" font-size="10.5">durable · uid-scoped rules</text>
  <text x="610" y="352" class="muted mono" font-size="10.5">memories</text>
  <text x="700" y="352" text-anchor="middle" class="faint" font-size="9.5">↳ vector search</text>
  <text x="610" y="374" class="muted mono" font-size="10.5">conversations</text>
  <text x="610" y="396" class="muted mono" font-size="10.5">capabilities</text>
  <text x="700" y="418" text-anchor="middle" class="faint" font-size="9.5">(no RTDB equivalent for vector search)</text>

  <rect x="590" y="470" width="220" height="110" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="700" y="498" text-anchor="middle" class="ink" font-size="13" font-weight="600">Control endpoint</text>
  <text x="700" y="518" text-anchor="middle" class="muted mono" font-size="11">mintContainerToken()</text>
  <text x="700" y="540" text-anchor="middle" class="faint" font-size="10.5">Admin SDK · no VM key issued</text>

  <!-- ===== VM boundary ===== -->
  <rect x="870" y="90" width="290" height="560" rx="10" fill="none" stroke="#b5590f" stroke-width="1.5" stroke-dasharray="6 5"></rect>
  <text x="885" y="114" font-size="12.5" font-weight="600" fill="#b5590f">Linux VM · 4 GB · self-hosted</text>
  <text x="885" y="131" class="faint" font-size="10.5">outbound-only — no inbound ports</text>

  <rect x="900" y="150" width="230" height="66" rx="8" fill="#f7e6d5" stroke="#b5590f" stroke-width="1.5"></rect>
  <text x="1015" y="177" text-anchor="middle" class="ink" font-size="12.5" font-weight="600">Orchestrator daemon</text>
  <text x="1015" y="194" text-anchor="middle" class="muted" font-size="10.5">live dispatchQueue listener</text>

  <rect x="900" y="270" width="230" height="60" rx="7" fill="#f7e6d5" stroke="#b5590f" stroke-width="1.6"></rect>
  <text x="1015" y="294" text-anchor="middle" class="ink" font-size="12" font-weight="600">container · uid A</text>
  <text x="1015" y="310" text-anchor="middle" class="muted" font-size="10.5">running</text>

  <rect x="900" y="350" width="230" height="46" rx="7" fill="#e4e9ed" stroke="#8494a1" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75"></rect>
  <text x="1015" y="378" text-anchor="middle" class="faint" font-size="11.5">container · uid B — idle</text>

  <rect x="900" y="410" width="230" height="40" rx="7" fill="none" stroke="#8494a1" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"></rect>
  <text x="1015" y="434" text-anchor="middle" class="faint" font-size="11">container · uid C — stopped</text>

  <!-- ===== Arrows: client writes ===== -->
  <line x1="260" y1="103" x2="296" y2="180" stroke="#8494a1" stroke-width="1.4" marker-end="url(#arrow)"></line>
  <text x="270" y="140" text-anchor="middle" class="muted mono" font-size="10.5">push</text>

  <line x1="260" y1="565" x2="296" y2="470" stroke="#8494a1" stroke-width="1.4" marker-end="url(#arrow)"></line>
  <text x="270" y="530" text-anchor="middle" class="muted mono" font-size="10.5">push</text>

  <line x1="296" y1="410" x2="260" y2="545" stroke="#8494a1" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"></line>
  <text x="255" y="470" text-anchor="middle" class="faint mono" font-size="10" transform="rotate(-58 255 470)">onValue → reply</text>

  <text x="150" y="612" text-anchor="middle" class="faint" font-size="10">(own scoped session — extension has no reply channel yet, only web chat does)</text>

  <!-- ===== Arrows: RTDB &lt;-&gt; trigger fn ===== -->
  <line x1="520" y1="230" x2="588" y2="150" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#arrowCloud)"></line>
  <text x="560" y="185" text-anchor="middle" class="muted mono" font-size="10">onValueCreated</text>

  <!-- ===== Arrow: trigger fn -> Firestore ===== -->
  <line x1="700" y1="212" x2="700" y2="278" stroke="#0e7c86" stroke-width="1.4" marker-end="url(#arrowCloud)"></line>
  <text x="748" y="248" text-anchor="middle" class="muted" font-size="10">writes memory +</text>
  <text x="748" y="261" text-anchor="middle" class="muted" font-size="10">conversation</text>

  <!-- ===== Arrow: trigger fn -> RTDB dispatchQueue (job) ===== -->
  <path d="M588,195 C 545,195 522,455 518,470" fill="none" stroke="#0e7c86" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowCloud)"></path>
  <text x="540" y="430" text-anchor="middle" class="faint mono" font-size="10">writes job →</text>
  <text x="540" y="443" text-anchor="middle" class="faint mono" font-size="10">dispatchQueue</text>

  <!-- ===== Arrows: orchestrator &lt;-&gt; RTDB / control endpoint ===== -->
  <path d="M900,178 C 700,178 560,478 520,483" fill="none" stroke="#b5590f" stroke-width="1.6" marker-end="url(#arrowVm)"></path>
  <text x="700" y="530" text-anchor="middle" class="muted mono" font-size="10.5">onValue: dispatchQueue — live, no poll</text>

  <path d="M900,205 C 860,205 830,525 812,527" fill="none" stroke="#b5590f" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowVm)"></path>
  <text x="845" y="500" text-anchor="middle" class="muted mono" font-size="10">mint token(uid)</text>

  <!-- ===== Arrow: orchestrator -> container A ===== -->
  <line x1="1015" y1="216" x2="1015" y2="268" stroke="#b5590f" stroke-width="1.6" marker-end="url(#arrowVm)"></line>
  <text x="1015" y="245" text-anchor="middle" class="muted mono" font-size="10">start / stop · idle timeout</text>

  <!-- ===== Arrow: container A -> Firestore ===== -->
  <line x1="898" y1="310" x2="812" y2="360" stroke="#b5590f" stroke-width="1.6" marker-end="url(#arrowVm)"></line>
  <text x="855" y="298" text-anchor="middle" class="muted mono" font-size="10">scoped session:</text>
  <text x="855" y="311" text-anchor="middle" class="faint" font-size="9.5">read/write memories</text>

  <!-- ===== Arrow: container A -> RTDB commands (reply) ===== -->
  <path d="M898,325 C 650,325 560,365 520,368" fill="none" stroke="#b5590f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowVm)"></path>
  <text x="700" y="392" text-anchor="middle" class="muted mono" font-size="10">writes reply → commands/{uid}</text>
</svg>
