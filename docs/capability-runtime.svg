<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" role="img" aria-label="Extension and web chat push into a Firebase Decision Maker (Genkit, RAG plus LLM classify) inside a Firebase trust boundary alongside Firestore and a control endpoint. The Decision Maker writes memory to Firestore directly and dispatches jobs to a purely mechanical VM Orchestrator, which has no LLM calls of its own. The Orchestrator mints a token and starts a per-user container holding two roles, Executor and Creator, each of which calls the LLM independently and talks to Firestore directly; Executor runs a matched capability, Creator iterates to build a new one. Solid arrows are Realtime Database queues, dashed arrows are direct calls, dotted arrows are LLM calls.">
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace; }
    .ink { fill: #172230; }
    .muted { fill: #526270; }
    .faint { fill: #8494a1; }
    .box-fill { fill: #e4e9ed; stroke: #c7d0d7; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8494a1"></path>
    </marker>
    <marker id="arrowCloud" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"></path>
    </marker>
    <marker id="arrowVm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5590f"></path>
    </marker>
    <marker id="arrowLlm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5ea8"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="600" fill="#f7f9fb"></rect>

  <!-- ================= CLIENTS ================= -->
  <rect x="40" y="60" width="230" height="90" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="155" y="96" text-anchor="middle" class="ink" font-size="14" font-weight="600">Extension</text>
  <text x="155" y="118" text-anchor="middle" class="muted mono" font-size="11">WhatsApp Web session</text>

  <rect x="40" y="430" width="230" height="90" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="155" y="466" text-anchor="middle" class="ink" font-size="14" font-weight="600">Web chat page</text>
  <text x="155" y="488" text-anchor="middle" class="muted mono" font-size="11">phone auth → chat UI</text>

  <!-- ================= FIREBASE (trust boundary) ================= -->
  <rect x="310" y="40" width="310" height="500" rx="10" fill="none" stroke="#0e7c86" stroke-width="1.5" stroke-dasharray="6 5"></rect>
  <text x="326" y="62" class="ink" font-size="13" font-weight="600" fill="#0e7c86">Firebase · trusted first-party</text>
  <text x="326" y="80" class="faint" font-size="10.5">Cloud Functions + Firestore</text>

  <rect x="330" y="95" width="270" height="95" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="465" y="126" text-anchor="middle" class="ink" font-size="14" font-weight="600">Decision Maker</text>
  <text x="465" y="146" text-anchor="middle" class="muted mono" font-size="10.5">Genkit · RAG + LLM classify</text>
  <text x="465" y="164" text-anchor="middle" class="faint mono" font-size="9.5">(fires on new RTDB queue values)</text>

  <rect x="330" y="215" width="270" height="170" rx="8" fill="#dcf0f1" stroke="#0e7c86" stroke-width="1.5"></rect>
  <text x="465" y="245" text-anchor="middle" class="ink" font-size="15" font-weight="700">Firestore</text>
  <text x="465" y="262" text-anchor="middle" class="muted" font-size="10.5">durable · uid-scoped rules</text>
  <text x="352" y="288" class="muted mono" font-size="11">memories</text>
  <text x="366" y="304" class="faint" font-size="9.5">↳ vector search</text>
  <text x="352" y="326" class="muted mono" font-size="11">conversations</text>
  <text x="352" y="346" class="muted mono" font-size="11">capabilities</text>
  <text x="465" y="370" text-anchor="middle" class="faint" font-size="9">no RTDB equivalent for vector search</text>

  <rect x="330" y="445" width="270" height="85" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="465" y="475" text-anchor="middle" class="ink" font-size="14" font-weight="600">Control endpoint</text>
  <text x="465" y="496" text-anchor="middle" class="muted mono" font-size="11">mintContainerToken()</text>
  <text x="465" y="515" text-anchor="middle" class="faint" font-size="10">Admin SDK · no VM key issued</text>

  <!-- ================= VM (trust boundary) ================= -->
  <rect x="690" y="40" width="450" height="420" rx="10" fill="none" stroke="#b5590f" stroke-width="1.5" stroke-dasharray="6 5"></rect>
  <text x="706" y="62" class="ink" font-size="13" font-weight="600" fill="#b5590f">Linux VM · 4 GB · self-hosted</text>
  <text x="706" y="80" class="faint" font-size="10.5">outbound-only — no inbound ports</text>

  <rect x="710" y="98" width="410" height="70" rx="8" fill="#f7e6d5" stroke="#b5590f" stroke-width="1.5"></rect>
  <text x="915" y="126" text-anchor="middle" class="ink" font-size="14" font-weight="600">Orchestrator daemon</text>
  <text x="915" y="146" text-anchor="middle" class="muted" font-size="10.5">mechanical only · no LLM calls</text>

  <rect x="710" y="188" width="410" height="100" rx="7" fill="#f7e6d5" stroke="#b5590f" stroke-width="1.6"></rect>
  <text x="915" y="210" text-anchor="middle" class="ink" font-size="13" font-weight="600">container · uid A — running</text>
  <text x="915" y="232" text-anchor="middle" class="muted mono" font-size="10.5">Executor — runs matched capability</text>
  <text x="915" y="252" text-anchor="middle" class="muted mono" font-size="10.5">Creator — builds new one (agentic loop)</text>
  <text x="915" y="270" text-anchor="middle" class="faint" font-size="9">job type from dispatchQueue picks the role</text>

  <rect x="710" y="298" width="410" height="46" rx="7" class="box-fill" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75"></rect>
  <text x="915" y="326" text-anchor="middle" class="faint" font-size="11.5">container · uid B — idle</text>

  <rect x="710" y="356" width="410" height="40" rx="7" fill="none" stroke="#8494a1" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"></rect>
  <text x="915" y="380" text-anchor="middle" class="faint" font-size="11">container · uid C — stopped</text>

  <!-- ================= LLM (separate entity) ================= -->
  <rect x="790" y="475" width="280" height="65" rx="8" fill="#ece7f5" stroke="#7a5ea8" stroke-width="1.5"></rect>
  <text x="930" y="502" text-anchor="middle" class="ink" font-size="14" font-weight="700">LLM (Gemini)</text>
  <text x="930" y="521" text-anchor="middle" class="muted mono" font-size="10">called independently by Decision Maker, Executor, Creator</text>

  <!-- ================= Arrows ================= -->

  <!-- Extension -> Decision Maker (ingestQueue, RTDB) -->
  <line x1="270" y1="100" x2="328" y2="115" stroke="#8494a1" stroke-width="1.4" marker-end="url(#arrow)"></line>
  <text x="299" y="92" text-anchor="middle" class="faint mono" font-size="9">ingestQueue</text>

  <!-- Web chat -> Decision Maker (commands, RTDB) -->
  <line x1="270" y1="478" x2="330" y2="140" stroke="#8494a1" stroke-width="1.4" marker-end="url(#arrow)"></line>
  <text x="305" y="300" text-anchor="middle" class="faint mono" font-size="9">commands</text>
  <text x="150" y="536" text-anchor="middle" class="faint" font-size="9">(extension has no reply channel yet)</text>

  <!-- Decision Maker -> Firestore (direct write) -->
  <line x1="465" y1="190" x2="465" y2="213" stroke="#0e7c86" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowCloud)"></line>
  <text x="545" y="205" text-anchor="middle" class="muted mono" font-size="9.5">writes memory</text>

  <!-- Decision Maker -> Orchestrator (dispatchQueue, RTDB) -->
  <line x1="602" y1="140" x2="708" y2="130" stroke="#0e7c86" stroke-width="1.5" marker-end="url(#arrowCloud)"></line>
  <text x="655" y="122" text-anchor="middle" class="muted mono" font-size="9.5">dispatchQueue</text>

  <!-- Orchestrator -> Control endpoint (mint token, direct) -->
  <path d="M710,158 C 660,158 630,470 602,485" fill="none" stroke="#b5590f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowVm)"></path>
  <text x="650" y="330" text-anchor="middle" class="muted mono" font-size="9.5">mint token</text>

  <!-- Orchestrator -> container A (start/stop, direct) -->
  <line x1="915" y1="168" x2="915" y2="186" stroke="#b5590f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowVm)"></line>
  <text x="1030" y="180" text-anchor="middle" class="muted mono" font-size="9.5">start / stop</text>

  <!-- container A -> Firestore (scoped session, direct) -->
  <path d="M708,225 C 660,225 620,265 602,268" fill="none" stroke="#b5590f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowVm)"></path>
  <text x="655" y="213" text-anchor="middle" class="muted mono" font-size="9.5">scoped session</text>

  <!-- container A -> Web chat page (reply, via commands, RTDB) -->
  <path d="M710,240 L650,240 L650,410 L300,410 L300,460 L270,460" fill="none" stroke="#b5590f" stroke-width="1.6" marker-end="url(#arrowVm)"></path>
  <text x="475" y="403" text-anchor="middle" class="muted mono" font-size="9.5">commands</text>

  <!-- Decision Maker -> LLM (dotted) -->
  <path d="M600,150 C 660,150 660,480 788,500" fill="none" stroke="#7a5ea8" stroke-width="1.3" stroke-dasharray="1 4" marker-end="url(#arrowLlm)"></path>

  <!-- container A (Executor/Creator) -> LLM (dotted) -->
  <line x1="960" y1="288" x2="960" y2="473" stroke="#7a5ea8" stroke-width="1.3" stroke-dasharray="1 4" marker-end="url(#arrowLlm)"></line>

  <text x="600" y="575" text-anchor="middle" class="faint" font-size="10">Solid = Realtime Database queue. Dashed = direct call (Firestore SDK, HTTPS, local Docker). Dotted = LLM call.</text>
</svg>
