<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" role="img" aria-label="Extension and the web chat page both send into a Firebase ingest and command trigger, which writes durable data to Firestore and dispatches capability jobs to a VM orchestrator. The orchestrator mints a per-user scoped token from a control endpoint and starts that user's Docker container, which reads and writes Firestore with its own scoped session and sends its reply back to the web chat page. All of these connections are actually carried over Firebase Realtime Database queues, omitted here for clarity; every VM-to-Firebase connection is outbound only.">
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace; }
    .ink { fill: #172230; }
    .muted { fill: #526270; }
    .faint { fill: #8494a1; }
    .box-fill { fill: #e4e9ed; stroke: #c7d0d7; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8494a1"></path>
    </marker>
    <marker id="arrowCloud" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"></path>
    </marker>
    <marker id="arrowVm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5590f"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="580" fill="#f7f9fb"></rect>

  <!-- ================= CLIENTS ================= -->
  <rect x="40" y="60" width="230" height="90" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="155" y="96" text-anchor="middle" class="ink" font-size="14" font-weight="600">Extension</text>
  <text x="155" y="118" text-anchor="middle" class="muted mono" font-size="11">WhatsApp Web session</text>

  <rect x="40" y="430" width="230" height="90" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="155" y="466" text-anchor="middle" class="ink" font-size="14" font-weight="600">Web chat page</text>
  <text x="155" y="488" text-anchor="middle" class="muted mono" font-size="11">phone auth → chat UI</text>

  <!-- ================= FIREBASE ================= -->
  <text x="465" y="38" text-anchor="middle" class="muted mono" font-size="10.5" letter-spacing="0.03em">FIREBASE · TRUSTED FIRST-PARTY CODE</text>

  <rect x="330" y="60" width="270" height="100" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="465" y="94" text-anchor="middle" class="ink" font-size="14" font-weight="600">Ingest / command trigger</text>
  <text x="465" y="116" text-anchor="middle" class="muted" font-size="10.5">synthesize · match / build capability</text>
  <text x="465" y="135" text-anchor="middle" class="faint mono" font-size="9.5">(fires on new RTDB queue values)</text>

  <rect x="330" y="200" width="270" height="180" rx="8" fill="#dcf0f1" stroke="#0e7c86" stroke-width="1.5"></rect>
  <text x="465" y="232" text-anchor="middle" class="ink" font-size="15" font-weight="700">Firestore</text>
  <text x="465" y="250" text-anchor="middle" class="muted" font-size="10.5">durable · uid-scoped rules</text>
  <text x="352" y="278" class="muted mono" font-size="11">memories</text>
  <text x="366" y="295" class="faint" font-size="9.5">↳ vector search</text>
  <text x="352" y="319" class="muted mono" font-size="11">conversations</text>
  <text x="352" y="341" class="muted mono" font-size="11">capabilities</text>
  <text x="465" y="368" text-anchor="middle" class="faint" font-size="9">no RTDB equivalent for vector search</text>

  <rect x="330" y="430" width="270" height="90" rx="8" class="box-fill" stroke-width="1.5"></rect>
  <text x="465" y="464" text-anchor="middle" class="ink" font-size="14" font-weight="600">Control endpoint</text>
  <text x="465" y="486" text-anchor="middle" class="muted mono" font-size="11">mintContainerToken()</text>
  <text x="465" y="507" text-anchor="middle" class="faint" font-size="10">Admin SDK · no VM key issued</text>

  <!-- ================= VM ================= -->
  <rect x="690" y="40" width="450" height="340" rx="10" fill="none" stroke="#b5590f" stroke-width="1.5" stroke-dasharray="6 5"></rect>
  <text x="706" y="64" class="ink" font-size="13" font-weight="600" fill="#b5590f">Linux VM · 4 GB · self-hosted</text>
  <text x="706" y="82" class="faint" font-size="10.5">outbound-only — no inbound ports</text>

  <rect x="710" y="98" width="410" height="72" rx="8" fill="#f7e6d5" stroke="#b5590f" stroke-width="1.5"></rect>
  <text x="915" y="128" text-anchor="middle" class="ink" font-size="14" font-weight="600">Orchestrator daemon</text>
  <text x="915" y="149" text-anchor="middle" class="muted" font-size="10.5">one process, all users</text>

  <rect x="710" y="190" width="410" height="58" rx="7" fill="#f7e6d5" stroke="#b5590f" stroke-width="1.6"></rect>
  <text x="915" y="215" text-anchor="middle" class="ink" font-size="13" font-weight="600">container · uid A</text>
  <text x="915" y="233" text-anchor="middle" class="muted" font-size="10.5">running</text>

  <rect x="710" y="264" width="410" height="46" rx="7" fill="#e4e9ed" stroke="#8494a1" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75"></rect>
  <text x="915" y="292" text-anchor="middle" class="faint" font-size="11.5">container · uid B — idle</text>

  <rect x="710" y="326" width="410" height="40" rx="7" fill="none" stroke="#8494a1" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"></rect>
  <text x="915" y="351" text-anchor="middle" class="faint" font-size="11">container · uid C — stopped</text>

  <!-- ================= Arrows (direct; carried over RTDB, see caption) ================= -->

  <!-- Extension -> Ingest trigger -->
  <line x1="270" y1="100" x2="328" y2="100" stroke="#8494a1" stroke-width="1.4" marker-end="url(#arrow)"></line>

  <!-- Web chat -> Ingest trigger -->
  <line x1="270" y1="475" x2="330" y2="110" stroke="#8494a1" stroke-width="1.4" marker-end="url(#arrow)"></line>
  <text x="150" y="536" text-anchor="middle" class="faint" font-size="9">(extension has no reply channel yet)</text>

  <!-- Ingest trigger -> Firestore -->
  <line x1="465" y1="160" x2="465" y2="198" stroke="#0e7c86" stroke-width="1.5" marker-end="url(#arrowCloud)"></line>
  <text x="540" y="182" text-anchor="middle" class="muted mono" font-size="9.5">writes memory</text>

  <!-- Ingest trigger -> Orchestrator (dispatch) -->
  <line x1="602" y1="105" x2="708" y2="120" stroke="#0e7c86" stroke-width="1.5" marker-end="url(#arrowCloud)"></line>
  <text x="655" y="98" text-anchor="middle" class="muted mono" font-size="9.5">dispatch job</text>

  <!-- Orchestrator -> Control endpoint (mint token) -->
  <path d="M710,150 C 670,150 640,400 602,466" fill="none" stroke="#b5590f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowVm)"></path>
  <text x="655" y="300" text-anchor="middle" class="muted mono" font-size="9.5">mint token</text>

  <!-- Orchestrator -> container A (start/stop) -->
  <line x1="915" y1="170" x2="915" y2="188" stroke="#b5590f" stroke-width="1.6" marker-end="url(#arrowVm)"></line>
  <text x="1005" y="182" text-anchor="middle" class="muted mono" font-size="9.5">start / stop</text>

  <!-- container A -> Firestore -->
  <path d="M708,205 C 660,205 620,240 602,242" fill="none" stroke="#b5590f" stroke-width="1.6" marker-end="url(#arrowVm)"></path>
  <text x="655" y="193" text-anchor="middle" class="muted mono" font-size="9.5">scoped session</text>

  <!-- container A -> Web chat page (reply) -->
  <path d="M710,200 L650,200 L650,405 L300,405 L300,460 L270,460" fill="none" stroke="#b5590f" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowVm)"></path>
  <text x="475" y="398" text-anchor="middle" class="muted mono" font-size="9.5">reply</text>

  <text x="600" y="565" text-anchor="middle" class="faint" font-size="10">Arrows shown direct — every connection is actually carried over a Firebase Realtime Database queue.</text>
</svg>
